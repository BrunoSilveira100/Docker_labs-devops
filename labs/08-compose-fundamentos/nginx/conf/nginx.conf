worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # UNIFEG: log customizado com tempo de resposta
    log_format unifeg '$remote_addr - [$time_local] "$request" '
                       '$status $body_bytes_sent tempo=${request_time}s';
    access_log /dev/stdout unifeg;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name lab-nginx-unifeg;

        add_header X-Servido-Por "Nginx-Unifeg-Lab07" always;
        add_header X-Autor "Bruno Silveira" always;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        # Proxy reverso: tudo em /api/ é encaminhado para o container "backend"
        location /api/ {
            proxy_pass         http://backend:4000/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
