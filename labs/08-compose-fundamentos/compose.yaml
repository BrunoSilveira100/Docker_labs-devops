name: lab08-compose-fundamentos

services:
  apache:
    image: httpd:2.4
    ports:
      - "8080:80"
    volumes:
      - ./apache/site:/usr/local/apache2/htdocs
      - ./apache/conf/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    networks:
      - rede-lab08

  backend:
    build: ./backend
    networks:
      - rede-lab08

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/site:/usr/share/nginx/html:ro
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - rede-lab08

networks:
  rede-lab08:
    driver: bridge
