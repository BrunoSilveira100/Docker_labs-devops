# Prática 14 — Projeto integrador
# React (Nginx) -> API (Node) -> PostgreSQL, com pgAdmin para inspeção.
#
# Topologia de rede por camada (isolamento de tráfego):
#   rede-frontend : frontend <-> backend
#   rede-backend  : backend  <-> db <-> pgadmin   (internal: sem saída para a internet)
# O frontend NÃO enxerga o banco; o banco NÃO publica porta no host.
#
# Segredos: nenhuma senha neste arquivo. Tudo vem do .env (ignorado pelo git),
# criado a partir do .env.example.
name: lab14-projeto-integrador

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data          # volume nomeado: dados persistem
      - ./init:/docker-entrypoint-initdb.d:ro     # só roda com o volume VAZIO
    healthcheck:
      # $$ = variável lida dentro do container, em tempo de execução
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - rede-backend

  pgadmin:
    image: dpage/pgadmin4:8
    env_file: .env
    environment:
      # SERVER_MODE fica no padrão (True): é o modo correto quando o
      # pgAdmin roda num container exposto por porta, não em uso desktop local.
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "8083:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - rede-backend
      - rede-pgadmin   # rede comum (não internal) só para publicar a porta 8083

  backend:
    build: ./backend
    image: backend-lab14:1.0
    env_file: .env      # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    environment:
      PGHOST: db        # nome do serviço na rede-backend (DNS do Compose)
    depends_on:
      db:
        condition: service_healthy
    # HEALTHCHECK definido no Dockerfile (GET /status)
    restart: unless-stopped
    networks:
      - rede-backend    # fala com o banco
      - rede-frontend   # recebe o proxy do Nginx

  frontend:
    build: ./frontend
    image: frontend-lab14:1.0
    ports:
      - "8084:80"
    depends_on:
      backend:
        condition: service_healthy   # o proxy /api só sobe com a API pronta
    # HEALTHCHECK definido no Dockerfile (GET /)
    restart: unless-stopped
    networks:
      - rede-frontend

volumes:
  pgdata:
  pgadmin_data:

networks:
  rede-frontend:
    driver: bridge
  rede-backend:
    driver: bridge
    internal: true     # banco e API sem rota para fora: menor superfície de ataque
  rede-pgadmin:
    driver: bridge
