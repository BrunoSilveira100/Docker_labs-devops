# Nginx de PRODUÇÃO do Lab 12 — Bruno Silveira · Unifeg 2026B
# Serve o build estático do Vite (dist/) como SPA.
#
# Atenção a uma pegadinha do Nginx: se um "location" declara QUALQUER
# add_header, ele NÃO herda os add_header do bloco "server". Por isso o
# conjunto completo de cabeçalhos é repetido em cada location.
server {
    listen 80;
    server_name lab12-react-bruno;
    root /usr/share/nginx/html;
    index index.html;

    # compressão das respostas de texto (JS/CSS/HTML)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # arquivos com hash no nome (assets/*.js, *.css) nunca mudam: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Autor "Bruno Silveira" always;
        try_files $uri =404;
    }

    # SPA: rota inexistente cai no index.html (o roteamento é feito no cliente).
    # O index.html não vai para o cache, para o deploy novo aparecer na hora.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Autor "Bruno Silveira" always;
        try_files $uri $uri/ /index.html;
    }
}
