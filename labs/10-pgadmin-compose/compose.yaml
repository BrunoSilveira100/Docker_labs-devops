# Prática 10 — pgAdmin + PostgreSQL via Compose
# Senhas ficam SÓ no .env (ignorado pelo git); o .env.example é o modelo versionado.
name: lab10-pgadmin-compose

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data              # volume nomeado: dados gerenciados
      - ./init:/docker-entrypoint-initdb.d:ro         # só roda com o volume VAZIO
    healthcheck:
      # $$ = lê a variável do ambiente do container em tempo de execução
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - rede-lab10
    # sem "ports": o banco só é acessível pela rede interna (pgAdmin usa host "db")

  pgadmin:
    image: dpage/pgadmin4:8
    env_file: .env
    environment:
      # SERVER_MODE fica no padrão (True): é o modo correto quando o
      # pgAdmin roda num container exposto por porta, não em uso desktop local.
      # ".local" não passa na checagem padrão de "e-mail entregável" do pgAdmin
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /misc/ping responde "PING" quando o servidor web do pgAdmin está pronto
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - rede-lab10

volumes:
  pgdata:
  pgadmin_data:

networks:
  rede-lab10:
    driver: bridge
